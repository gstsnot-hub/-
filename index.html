<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一键弹幕转换</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#0f0f1a; color:#e0e0e0; min-height:100vh; padding:20px; }
h1 { text-align:center; font-size:1.8em; margin-bottom:8px; background:linear-gradient(135deg,#00d4ff,#7b2ff7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.subtitle { text-align:center; color:#888; margin-bottom:24px; font-size:.9em; }
.container { max-width:860px; margin:0 auto; }
.card { background:#1a1a2e; border-radius:12px; padding:24px; margin-bottom:20px; border:1px solid #2a2a4a; }
.card h2 { color:#00d4ff; margin-bottom:14px; font-size:1.15em; }
label { display:block; margin-bottom:6px; color:#aaa; font-size:.88em; }
textarea { width:100%; min-height:180px; padding:12px; border-radius:8px; border:1px solid #3a3a5a; background:#0f0f1a; color:#e0e0e0; font-family:monospace; font-size:.85em; resize:vertical; }
textarea:focus { outline:none; border-color:#00d4ff; }
.row { display:flex; gap:12px; margin-top:12px; }
.row > * { flex:1; }
select { width:100%; padding:10px 14px; border-radius:8px; border:1px solid #3a3a5a; background:#0f0f1a; color:#e0e0e0; font-size:1em; }
select:focus { outline:none; border-color:#00d4ff; }
button { width:100%; padding:12px; border-radius:8px; border:none; background:linear-gradient(135deg,#00d4ff,#7b2ff7); color:#fff; font-weight:600; font-size:1em; cursor:pointer; margin-top:12px; transition:opacity .2s; }
button:hover { opacity:.85; }
.file-drop { border:2px dashed #3a3a5a; border-radius:8px; padding:28px; text-align:center; color:#666; cursor:pointer; transition:border-color .2s; }
.file-drop:hover { border-color:#00d4ff; color:#00d4ff; }
.result { margin-top:16px; padding:14px; border-radius:8px; background:#0f0f1a; border:1px solid #2a2a4a; }
.result pre { white-space:pre-wrap; word-break:break-all; font-size:.85em; max-height:280px; overflow-y:auto; }
.download-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.download-btns button { width:auto; padding:8px 18px; font-size:.85em; margin-top:0; }
.notice { background:#ffaa0022; border:1px solid #ffaa0055; border-radius:8px; padding:12px; margin-bottom:20px; color:#ffaa00; font-size:.85em; }
</style>
</head>
<body>

<h1>🔄 一键弹幕转换</h1>
<p class="subtitle">B站弹幕 XML → ASS / SRT / TXT</p>

<div class="container">

<div class="notice">
⚠️ <strong>纯前端版本说明：</strong>弹幕<strong>获取</strong>功能需要后端代理（浏览器CORS限制），如需获取弹幕请使用 Python 版本。<br>
此页面仅提供<strong>弹幕转换</strong>功能，完全本地运行，无需服务器。
</div>

<div class="card">
  <h2>📂 输入弹幕 XML</h2>
  <div class="file-drop" id="file-drop" onclick="document.getElementById('file-input').click()">
    点击选择 或 拖拽 XML 文件到此处
    <input id="file-input" type="file" accept=".xml" style="display:none" onchange="handleFile(event)">
  </div>
  <label style="margin-top:12px">或粘贴 XML 内容</label>
  <textarea id="xml-input" placeholder="粘贴 B站弹幕 XML 内容（<i><d p=&quot;...&quot;>...</d></i> 格式）"></textarea>
  <div class="row">
    <div>
      <label>输出格式</label>
      <select id="out-fmt">
        <option value="ass">ASS 字幕</option>
        <option value="srt">SRT 字幕</option>
        <option value="txt">纯文本 TXT</option>
        <option value="xml">标准 XML</option>
      </select>
    </div>
  </div>
  <button onclick="convert()">🔄 开始转换</button>
  <div class="result" id="result" style="display:none"></div>
  <div class="download-btns" id="downloads" style="display:none"></div>
</div>

</div>

<script>
function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { document.getElementById('xml-input').value = ev.target.result; };
  reader.readAsText(file);
}

// 拖拽
const drop = document.getElementById('file-drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.borderColor='#00d4ff'; drop.style.color='#00d4ff'; });
drop.addEventListener('dragleave', () => { drop.style.borderColor='#3a3a5a'; drop.style.color='#666'; });
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.style.borderColor='#3a3a5a'; drop.style.color='#666';
  if (e.dataTransfer.files.length) {
    const reader = new FileReader();
    reader.onload = ev => { document.getElementById('xml-input').value = ev.target.result; };
    reader.readAsText(e.dataTransfer.files[0]);
  }
});
